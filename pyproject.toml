[project]
name = "knowledge-provider"
version = "0.1.0"
description = "Bharat Vistaar Docs Pipeline: review-driven document ingestion pipeline"
requires-python = ">=3.10"
dependencies = [
    # Temporal workflow engine
    "temporalio>=1.0.0",

    # FastAPI for REST API
    "fastapi>=0.100.0",
    "uvicorn>=0.20.0",

    # Chandra OCR 2 (remote vLLM/HF client; no local GPU/torch required in worker image)
    "chandra-ocr>=0.2.0",

    # pdf-inspector: fast local PDF classification + Markdown extraction for
    # text-based PDFs, so we can skip the OCR provider entirely for those pages.
    "pdf-inspector>=1.14.0",

    # Text processing
    "tiktoken>=0.5.0",
    "langchain-text-splitters>=0.0.1",

    # Vector search
    "qdrant-client>=1.12.0",
    # Local embeddings (default EMBEDDING_PROVIDER=sentence_transformers).
    # Pulls torch — image will be larger. Or set EMBEDDING_PROVIDER=openai_compatible
    # + EMBEDDING_BASE_URL for a remote embeddings API instead.
    "sentence-transformers==5.1.0",
    "transformers==4.56.1",
    "huggingface-hub==0.35.3",
    "torch",

    # Object storage
    "minio>=7.0.0",

    # HTTP client
    "httpx>=0.24.0",

    # In-process language detection (replaces the lang-detect HTTP service for
    # shared-script disambiguation, e.g. Devanagari -> hi/mr)
    "pyfranc>=0.2.3",

    # Utilities
    "pydantic>=2.0.0",
    "python-multipart>=0.0.6",
    "Pillow>=10.0.0",
    "openpyxl>=3.1.0",
    "pypdf>=5.0.0",
    "PyMuPDF>=1.27.0",

    # Rate limiting
    "slowapi>=0.1.9",

    # Auth (Keycloak JWT validation)
    "PyJWT[crypto]>=2.8.0",
]

[dependency-groups]
dev = [
    "pytest>=7.0.0",
    "pytest-asyncio>=0.21.0",
    "pytest-cov>=4.0.0",
    "ruff>=0.6.0",
]

# sentence-transformers depends on torch; resolve it from the CPU-only wheel
# index instead of default PyPI (which bundles CUDA and is far larger) —
# this image never needs GPU torch.
[tool.uv.sources]
torch = { index = "pytorch-cpu" }

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.ruff.lint.per-file-ignores]
# Standalone scripts insert the project root onto sys.path before importing
# project modules — that import necessarily comes after the sys.path mutation.
"scripts/*.py" = ["E402"]

[tool.coverage.report]
# Baseline at the time this gate was added was 47.89% (pipeline/, uv run
# pytest --cov=pipeline). Floor set a touch below that as headroom for
# minor cross-platform variance; raise it as real coverage improves, never
# lower it to make a drop pass.
fail_under = 47
