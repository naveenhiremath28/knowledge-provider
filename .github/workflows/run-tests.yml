name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  pipeline:
    name: pipeline (lint, test, coverage)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: knowledge_provider_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/knowledge_provider_test
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --frozen

      - name: Lint (ruff)
        run: uv run ruff check .

      - name: Test (pytest + coverage)
        run: uv run pytest --cov=pipeline --cov-report=xml --cov-report=html

      - name: Upload coverage artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-pipeline
          path: htmlcov/
          if-no-files-found: ignore
          retention-days: 14

      # pytest writes coverage.xml before it checks fail_under (pyproject.toml),
      # so the report exists even when the gate trips. `!cancelled()` uploads it
      # anyway: a failing build is exactly when the line-by-line report is most
      # useful. The job still fails — this only makes the report survive it.
      - name: Upload coverage to Codecov
        if: ${{ !cancelled() }}
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          # Named explicitly: without it the action sends no slug and Codecov has
          # to resolve the repo from the token alone, which fails opaquely
          # ("Repository not found") when the token and repo disagree.
          slug: ${{ github.repository }}
          files: ./coverage.xml
          fail_ci_if_error: true

  ui:
    name: ui (lint, test, coverage)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ui
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: ui/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint (eslint)
        run: npm run lint

      - name: Test (vitest + coverage)
        run: npm run test -- --coverage

      - name: Upload coverage artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-ui
          path: ui/coverage/
          if-no-files-found: ignore
          retention-days: 14
